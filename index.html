
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="phone">

        <!-- =========================
             SLIDE 1 : LOADING SCREEN
        ========================== -->
        <section id="loadingScreen" class="screen loading-screen">

            <!-- Awan -->
            <div class="cloud cloud-1">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-2">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-3">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-4">
                <div class="cloud-small"></div>
            </div>

            <!-- Judul -->
            <div class="logo">
                <div>WORD</div>
                <div>SCRAMBLE</div>
            </div>

            <!-- Ombak -->
            <div class="loading-wave"></div>

            <!-- Loading -->
            <div class="loading-content">
                <p>MEMUAT...</p>

                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
            </div>

            <!-- Platform kayu -->
            <div class="wood-platform">
                <div class="wood-line"></div>
                <div class="wood-line"></div>
                <div class="wood-line"></div>
                <div class="wood-line"></div>
            </div>

        </section>


        <!-- =========================
             SLIDE 2 : HOME SCREEN
        ========================== -->
        <section id="homeScreen" class="screen home-screen hidden">

            <!-- Awan -->
            <div class="cloud cloud-1">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-2">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-3">
                <div class="cloud-small"></div>
            </div>

            <div class="cloud cloud-4">
                <div class="cloud-small"></div>
            </div>

            <!-- Judul -->
            <div class="logo">
                <div>WORD</div>
                <div>SCRAMBLE</div>
            </div>

            <!-- Ombak -->
            <div class="pink-wave"></div>
            <div class="blue-wave"></div>

            <!-- Level -->
            <div class="level-circle">
                <span>LEVEL</span>
                <strong>01</strong>
            </div>

            <!-- BUNGA 1 -->
            <div class="flower flower-1">
                <span class="petal petal-1"></span>
                <span class="petal petal-2"></span>
                <span class="petal petal-3"></span>
                <span class="petal petal-4"></span>
                <span class="petal petal-5"></span>
                <span class="petal petal-6"></span>
                <span class="center"></span>
            </div>

            <!-- BUNGA 2 -->
            <div class="flower flower-2">
                <span class="petal petal-1"></span>
                <span class="petal petal-2"></span>
                <span class="petal petal-3"></span>
                <span class="petal petal-4"></span>
                <span class="petal petal-5"></span>
                <span class="petal petal-6"></span>
                <span class="center"></span>
            </div>

            <!-- BUNGA 3 -->
            <div class="flower flower-3">
                <span class="petal petal-1"></span>
                <span class="petal petal-2"></span>
                <span class="petal petal-3"></span>
                <span class="petal petal-4"></span>
                <span class="petal petal-5"></span>
                <span class="petal petal-6"></span>
                <span class="center"></span>
            </div>

            <!-- BUNGA 4 -->
            <div class="flower flower-4">
                <span class="petal petal-1"></span>
                <span class="petal petal-2"></span>
                <span class="petal petal-3"></span>
                <span class="petal petal-4"></span>
                <span class="petal petal-5"></span>
                <span class="petal petal-6"></span>
                <span class="center"></span>
            </div>

            <!-- Tombol -->
            <div class="home-content">
                <button id="startButton" class="start-button">
                    MULAI
                </button>

                <p class="play-now">PLAY NOW</p>
            </div>

            <!-- Tagline -->
            <p class="tagline">
                Susun huruf, temukan kata!
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
